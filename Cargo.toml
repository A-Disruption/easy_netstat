[package]
name = "easy_netstat"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.15.0-dev", features = [
    "tokio",
    "advanced",
    "debug",
    "canvas",
    "image",
    "svg",
    "markdown",
    "qr_code",
] }
widgets = { path = "C:/Rust Projects/widgets", features = ["collapsible", "tree", "color_picker_two", "popover", "layer"]}
advanced-table = { path = "C:/Rust Projects/advanced-table" }
iced-native-frame = { path = "C:/Rust Projects/iced-window-decorations" }
netstat2 = { version = "0.11.2" }
sysinfo = { version = "0.40" }
# Decodes the multi-resolution .ico into the raw RGBA that iced's window Icon`n# and image Handle both want. Same 0.25 that iced already pulls in.
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
# iced_fontello 0.14 still generates `Font::with_name`, which iced master renamed
# to `with_family`. Its master branch (0.15.0-dev) tracks the rename.
iced_fontello = { git = "https://github.com/hecrj/iced_fontello.git", branch = "master" }

# Embeds the .ico into the exe's Win32 resources, which is where Windows looks
# for the taskbar, Alt-Tab and Explorer icons.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `widgets` asks for `iced 0.15.0-dev`, which is unreleased, so cargo cannot
# resolve it from crates.io on its own. `[patch]` is only honoured in the
# manifest of the crate actually being built, so this block has to live here
# even though `widgets` carries its own copy. Both crates then share one
# `iced`, which is what keeps `Element` and `Theme` a single type across them.
[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
