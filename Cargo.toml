[package]
name = "easy_netstat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
iced = { version = "0.15.0-dev", features = [
    "tokio",
    "advanced",
    "image",
    "svg",
] }
widgets = { path = "../widgets", features = ["popover", "layer"]}
advanced-table = { path = "../advanced-table" }
iced-native-frame = { path = "../iced-window-decorations" }
sysinfo = { version = "0.40" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
tokio = { version = "1", features = ["rt", "sync"] }
# Decodes the multi-resolution .ico into RGBA for the window and title bar.
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Com"] }

# Embeds the .ico into the exe's Win32 resources, which is where Windows looks
# for the taskbar, Alt-Tab and Explorer icons.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `widgets` asks for `iced 0.15.0-dev`, which is unreleased, so cargo cannot
# resolve it from crates.io on its own. `[patch]` is only honoured in the
# manifest of the crate actually being built, so this block has to live here
# even though `widgets` carries its own copy. Both crates then share one
# `iced`, which is what keeps `Element` and `Theme` a single type across them.
[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", rev = "8ff48c42b0d5188223501ea1ccc506fd5beaf36a" }
