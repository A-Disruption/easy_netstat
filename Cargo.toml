[package]
name = "easy_netstat"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = [
    "tokio",
    "lazy",
    "advanced",
    "debug",
    "canvas",
    "image",
    "svg",
    "markdown",
    "qr_code",
] }
widgets = { path = "C:/Rust Projects/widgets", features = ["collapsible", "tree", "color_picker", "generic_overlay"]}
netstat2 = { version = "0.11.2" }
sysinfo = { version = "0.37.2" }

[build-dependencies]
iced_fontello = "0.13"